name: Repo Hygiene

on:
  pull_request:
    paths:
      - "opensearch/templates/openiti_chunks_template.json"
      - "config/**"
      - "apps/frontend/package-lock.json"
      - "apps/frontend/pnpm-lock.yaml"
      - ".github/workflows/repo-hygiene.yml"
  push:
    branches:
      - main
    paths:
      - "opensearch/templates/openiti_chunks_template.json"
      - "config/**"
      - "apps/frontend/package-lock.json"
      - "apps/frontend/pnpm-lock.yaml"
      - ".github/workflows/repo-hygiene.yml"

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install YAML parser
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML

      - name: Validate OpenSearch template JSON
        run: python -m json.tool opensearch/templates/openiti_chunks_template.json > /dev/null

      - name: Validate runtime config YAML
        run: |
          python -c "import yaml, pathlib; yaml.safe_load(pathlib.Path('config/search_runtime.yml').read_text(encoding='utf-8'))"
          python -c "import yaml, pathlib; yaml.safe_load(pathlib.Path('config/text_normalization.yml').read_text(encoding='utf-8'))"

      - name: Detect mixed frontend lockfiles
        run: |
          if [ -f apps/frontend/package-lock.json ] && [ -f apps/frontend/pnpm-lock.yaml ]; then
            echo "::warning::Both package-lock.json and pnpm-lock.yaml are present in apps/frontend. Consider standardizing on one package manager."
          fi
