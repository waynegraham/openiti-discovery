name: Backend Tests

on:
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - github_workflows
    paths:
      - "apps/api/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            apps/api/requirements.base.txt
            apps/api/requirements.dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.base.txt pytest

      - name: Run API tests
        run: python -m pytest apps/api/tests -q
